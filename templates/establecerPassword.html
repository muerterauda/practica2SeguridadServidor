{% extends "base.html" %}
{% block head %}
<meta charset="UTF-8">
<title>Aplicacion - Password</title>

<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
{% endblock %}

{% block content %}

</head>
<body>
<div class="container-fluid">
    <hr>
    <div class="container-header text-center"><h3><b>Establecer contraseña</b></h3></div>
    <hr>
    <div class="row flex-x1-nowrap text-center" style="margin-bottom: 10px;">
        <div class="offset-lg-3 col-lg-6 col-md-8">
            {% if user.password != '' %}
            <form lang="es" action="/serviciosBasicos/establecerContraseña" method="POST" id="myForm">
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text" id="text-password-1">Establezca la contaseña</span>
                    </div>
                    <input type="text" class="form-control" id="password-1" aria-describedby="basic-addon3">
                </div>
                <div class="input-group mb-3">
                    <div class="input-group-prepend">
                        <span class="input-group-text" id="text-password-2">Vuelve a introducirla</span>
                    </div>
                    <input type="text" class="form-control" id="password-2" aria-describedby="basic-addon3">
                </div>
                <button type="button" class="btn btn-primary">Establecer contrase&ntilde;a</button>
            </form>
            {% else %}
            {% endif %}
        </div>
    </div>
</div>

{% include "footer.html" %}
</body>
{% endblock %}
